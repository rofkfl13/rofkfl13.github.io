<style>

*{box-sizing:border-box}
body{margin:0;background:#cdebd6;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}
#gw{max-width:800px;margin:0 auto;padding:12px;user-select:none;-webkit-user-select:none}
#top{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
#top h1{font-size:20px;margin:0 auto 0 0;font-weight:800;color:#3f7a4a;letter-spacing:-.5px}
#scr{position:relative;border-radius:16px;overflow:hidden;background:#5ec8e6;border:4px solid var(--cream);box-shadow:0 4px 0 #9cc8b0}
#c{width:100%;display:block;image-rendering:pixelated;outline:none;touch-action:none}
.ov{position:absolute;display:none}
.pill{background:var(--cream);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;color:var(--ink);white-space:nowrap}
#hud{top:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap}
#toast{top:8px;right:8px}
#hint{left:50%;bottom:10px;transform:translateX(-50%)}
#dlg{left:3%;right:3%;bottom:4%;background:var(--cream);border:3px solid var(--line);border-radius:18px;padding:16px 18px 12px;min-height:64px;line-height:1.6;font-size:16px;cursor:pointer;color:var(--ink)}
#dn{position:absolute;top:-14px;left:16px;background:#ffb6c1;color:#6b2a3a;border-radius:999px;padding:1px 14px;font-size:14px;font-weight:800}
#modal{inset:0;background:rgba(40,30,20,.45);align-items:center;justify-content:center;padding:10px}
.box{background:var(--cream);border:3px solid var(--line);border-radius:18px;padding:14px;width:100%;max-width:640px;max-height:100%;overflow:auto;color:var(--ink)}
.slot{width:100%;aspect-ratio:1;background:var(--soft);border:2px solid #e0cda6;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;padding:0}
.slot img{width:72%;height:72%;object-fit:contain;image-rendering:pixelated}
.cnt{position:absolute;right:4px;bottom:1px;font-size:11px;font-weight:800}
.gb{background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:10px;padding:5px 11px;font-size:13px;cursor:pointer;font-family:inherit}
.gb:hover{background:#fff1d0}.gb.on{background:#ffe3a3}.gb.big{padding:8px 14px;font-weight:700}
.sel{outline:3px solid #ff9fb0}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #e0cda6;font-size:14px}
.row img{width:30px;height:30px;object-fit:contain;image-rendering:pixelated}
.grid{display:grid;gap:6px}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
#ctrl{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px}
.dp{width:50px;height:50px;border-radius:12px;border:2px solid var(--line);background:var(--cream);font-size:18px;color:var(--ink);touch-action:none}
.ab{border-radius:14px;border:2px solid var(--line);background:var(--cream);color:var(--ink);font-weight:800;padding:8px 14px;font-size:14px;font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit;border:2px solid #e0cda6;border-radius:10px;padding:8px;background:#fff;color:var(--ink);width:100%;font-size:14px}
@media(max-width:600px){.tip{display:none}#dlg{font-size:14px}}
.nm{font-size:11px;font-weight:700;background:rgba(255,248,231,.92);border:1px solid #c9a77a;border-radius:8px;padding:0 6px;color:#5b4636;white-space:nowrap;display:inline-block}
.bub{background:#fff;border:2px solid #c9a77a;border-radius:12px;padding:3px 9px;font-size:13px;margin-bottom:3px;max-width:180px;color:#5b4636;word-break:keep-all}
.err{color:#c0392b;font-size:13px;min-height:18px}
h3{margin:12px 0 6px;font-size:15px}
.muted{color:#a08060;font-size:12px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px #ff7f9f}

const TREES=[],ROCKS=[],FLW=[];const OBJ=new Int16Array(MW*MH).fill(-1);
const inR=(x,y,r)=>x>=r[0]&&x<=r[2]&&y>=r[1]&&y<=r[3];
(function genMap(){for(let y=0;y<MH;y++){MAP[y]=[];for(let x=0;x<MW;x++){const d=Math.min(x,y,MW-1-x,MH-1-y);const w=(Math.sin(x*.7+y*.3)+Math.cos(y*.8-x*.2))>1.1?1:0;let t=d<3+w?SEA:d<5+w?SAND:GR;
if(t===GR&&y>=49+(Math.sin(x*.4)>.5?1:0))t=SAND;if(t===GR&&x>=52&&x<=75&&y>=5&&y<=25&&!((x===52||y===5)&&hash(x,y)%2))t=FOR;MAP[y][x]=t}}
for(let y=0;y<MH;y++){const rx=riverX(y);for(let x=rx;x<=rx+1;x++)if(MAP[y][x]!==SEA)MAP[y][x]=RIVER}
for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(((x-42)/5.5)**2+((y-30)/3.5)**2<1)MAP[y][x]=LAKE;
for(let y=30;y<=35;y++)for(let x=50;x<=59;x++)MAP[y][x]=SOIL;
const P=(x,y)=>{const t=MAP[y][x];if(t===GR||t===FOR||t===SAND)MAP[y][x]=PATH};
const rowP=(y,a,b)=>{for(let x=a;x<=b;x++){if(MAP[y][x]===RIVER)MAP[y][x]=BRIDGE;else P(x,y)}};
rowP(13,7,58);rowP(23,6,60);rowP(44,24,48);rowP(37,8,24);
for(let y=13;y<=48;y++)P(24,y);for(let y=20;y<=23;y++)for(let x=12;x<=32;x++)P(x,y);for(let y=24;y<=29;y++)P(55,y);for(let y=36;y<=37;y++)P(8,y);for(let y=40;y<=44;y++)P(48,y);
BLD.forEach((b,i)=>{for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)OBJ[y*MW+x]=2000+i;if(!b.shop&&b.y<13)for(let y=b.y+b.h;y<=13;y++)P(b.x+1,y)});
const R=rng(20261125);const near=(x,y,r)=>{for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const t=(MAP[y+dy]||[])[x+dx];if(t===undefined||t===SEA||t===RIVER||t===LAKE||t===BRIDGE||t===SOIL)return true}return false};
const EX=[[11,15,34,24],[48,28,61,37],[7,12,11,15]];
const ok=(x,y)=>{if(OBJ[y*MW+x]>=0)return false;if(BLD.some(b=>x>=b.x-1&&x<=b.x+b.w&&y>=b.y-1&&y<=b.y+b.h+1))return false;if(EX.some(r=>inR(x,y,r)))return false;if(NPCS.some(n=>n.fx&&Math.abs(n.fx[0]-x)<2&&Math.abs(n.fx[1]-y)<2))return false;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(OBJ[(y+dy)*MW+x+dx]>=0&&OBJ[(y+dy)*MW+x+dx]<2000)return false;return!near(x,y,1)};
let nf=0,nt=0,np=0;const FRT=['apple','peach','orange','pear'];
for(let i=0;i<20000;i++){const x=4+Math.floor(R()*(MW-8)),y=4+Math.floor(R()*(MH-8));const t=MAP[y][x];if(!ok(x,y))continue;
if(t===FOR&&nf<80){TREES.push({x,y,k:'forest'});nf++}else if(t===GR&&nt<60&&R()<.35){TREES.push({x,y,k:'fruit',fr:FRT[Math.floor(R()*4)]});nt++}else if(t===SAND&&y>=48&&np<12&&!near(x,y,2)){TREES.push({x,y,k:'palm',fr:'coconut'});np++}else continue;OBJ[y*MW+x]=TREES.length-1}
for(let i=0;i<20000&&ROCKS.length<10;i++){const x=4+Math.floor(R()*(MW-8)),y=4+Math.floor(R()*(MH-8));const t=MAP[y][x];if((t===GR||t===FOR)&&ok(x,y)){ROCKS.push({x,y});OBJ[y*MW+x]=1000+ROCKS.length-1}}
const FC=['#ff6b81','#ffd84a','#ff9fd0','#ffffff','#b48aff'];for(let i=0;i<4000&&FLW.length<40;i++){const x=6+Math.floor(R()*30),y=26+Math.floor(R()*22);if(MAP[y][x]===GR&&OBJ[y*MW+x]<0&&!EX.some(r=>inR(x,y,r))&&!FLW.some(f=>f[0]===x&&f[1]===y))FLW.push([x,y,FC[Math.floor(R()*5)]])}})();

const bldAt=(x,y)=>{const o=(x<0||y<0||x>=MW||y>=MH)?-1:OBJ[y*MW+x];return o>=2000?BLD[o-2000]:null};
const treeAt=(x,y)=>{const o=(x<0||y<0||x>=MW||y>=MH)?-1:OBJ[y*MW+x];return o>=0&&o<1000?o:-1};

const flatAt=(x,y)=>at(S.weeds,x,y)>=0||at(S.digs,x,y)>=0||at(S.ground,x,y)>=0||!!S.plots[x+','+y];

if(kind==='shell'&&S.ground.filter(g=>IT[g[2]].cat==='beach').length<max){const p=randTile((t,x,y)=>t===SAND&&y>=47);if(p)S.ground.push([p[0],p[1],wpick(BEACH.map(b=>[b[0],rw(b[3],b[4],L*0.5)]))])}

Object.assign(n,o);if(!Array.isArray(n.trees)||n.trees.length!==TREES.length)n.trees=TREES.map(()=>({f:3,t:0}));if(!Array.isArray(n.rocks)||n.rocks.length!==ROCKS.length)n.rocks=ROCKS.map(()=>0);

let AC=null;function beep(f,d){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=.03;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function toast(s){const e=$('toast');e.textContent=s;e.style.display='block';tt=2.4}
function say(name,lines,cb){dlg={lines:[].concat(lines),i:0,c:0,cb};$('dlg').style.display='block';$('dn').textContent=name;$('dn').style.display=name?'block':'none';$('dt').textContent='';keys={}}
function dlgNext(){const l=dlg.lines[dlg.i];if(Math.floor(dlg.c)<l.length){dlg.c=l.length;$('dt').textContent=l;return}dlg.i++;dlg.c=0;if(dlg.i>=dlg.lines.length){const cb=dlg.cb;dlg=null;$('dlg').style.display='none';cb&&cb()}}
$('dlg').onclick=()=>{if(dlg)dlgNext()};

function shakeTree(i){shake={i,t:.5};beep(180,.06);const tr=S.trees[i],td=TREES[i];
if(td.k==='forest'){if(Math.random()<.25){spawnBugAt(td.x,td.y+1,wpick([['cicada',3],['stag',rw(2,3,lvl('net'))],['gstag',rw(.1,5,lvl('net'))]]));toast('나무에서 무언가 떨어졌다!')}else toast('흔들흔들… 아무것도 없다');return}
if(tr.f>0){let c=tr.f;for(const o of [[0,1],[-1,1],[1,1],[-1,0],[1,0],[0,-1]]){if(!c)break;const a=td.x+o[0],b=td.y+o[1];if(isWat(tileAt(a,b))||solid(a,b)||flatAt(a,b)||tileAt(a,b)===SOIL)continue;S.ground.push([a,b,td.fr]);c--}if(c)addItem(td.fr,c);tr.f=0;tr.t=Date.now()+180000;toast(`${IT[td.fr].n}${td.k==='palm'?'이':'가'} 떨어졌다!`)}else toast('흔들흔들… 다시 열리려면 조금 기다리자')}
function hitRock(i){if(Date.now()-S.rocks[i]<90000){say('',['단단하다. 조금 있다가 다시 와 보자.']);return}S.rocks[i]=Date.now();beep(150,.08);const L=lvl('shovel');const r=wpick([['stone',60],['iron',rw(25,3,L)],['goldore',rw(3,5,L)],['coins',12]]);if(r==='coins'){const c=100+Math.floor(Math.random()*5)*100;S.coins+=c;toast(`${c} 코인이 튀어나왔다!`)}else{if(addItem(r))toast(`${jo(IT[r].n,'을','를')} 얻었다`)}}
function dig(k){const[,,kind]=S.digs[k];S.digs.splice(k,1);beep(220,.08);const L=lvl('shovel');let id;if(kind==='b'&&Math.random()<.7)id=wpick(BEACH.map(b=>[b[0],rw(b[3],b[4],L)]));else id=wpick(FOSS.map(f=>[f[0],rw(f[3],f[4],L)]));catchThing(id,'파냈다');if(Math.random()<L*0.08){S.coins+=300;toast('보너스! 300 코인도 나왔다')}}
function cast(tx,ty,t){const area=t===SEA?'sea':t===RIVER?'river':'lake';const L=lvl('rod')+(S.bait>0?1.5:0);const pool=FISH.filter(f=>f[5]===area&&timeOk(f[6])).map(f=>[f[0],rw(f[3],f[4],L)]);const id=wpick(pool);const r=IT[id].r;F={ph:'wait',t:(1.2+Math.random()*3.3)*Math.max(.55,1-L*0.1),tx,ty,id,win:Math.max(.35,(0.75+0.15*L)*(1-0.08*(r-1)))};beep(500,.05)}
function fishPress(){if(F.ph==='bite'){const id=F.id;F=null;if(S.bait>0)S.bait--;catchThing(id,'낚았다')}else{F=null;say('',['앗, 너무 빨리 당겼다…'])}}
function spawnBugAt(x,y,id){const it=IT[id];B.push({id,beh:it.beh,x:x*T+8,y:y*T+(it.beh==='walk'?12:4),bx:x*T+8,by:y*T+4,ph:Math.random()*6,t:0,k:0,tx:x*T+8,ty:y*T+12,fl:Math.max(0,(it.r-1)*0.18-lvl('net')*0.08),ft:0,gone:0})}
function spawnBug(){const px=(S.px+8)>>4,py=(S.py+12)>>4;for(let n=0;n<30;n++){const x=px-12+Math.floor(Math.random()*25),y=py-8+Math.floor(Math.random()*17);if(Math.abs(x-px)<3&&Math.abs(y-py)<3)continue;const t=tileAt(x,y);if(solid(x,y)||t===SOIL)continue;const ar=[];if(t===SAND&&y>=47)ar.push('beach');else if(t===FOR)ar.push('forest');else if(t===GR||t===PATH)ar.push('meadow');
if(!(t===SAND&&y>=47))for(const d of [[0,1],[1,0],[0,-1],[-1,0],[2,0],[-2,0],[0,2],[0,-2]]){const q=tileAt(x+d[0],y+d[1]);if(q===RIVER||q===LAKE){ar.push('water');break}}
if(!ar.length)continue;const L=lvl('net')+(Date.now()<S.honeyT?1.5:0);const cand=BUGS.filter(b=>ar.includes(b[5])&&timeOk(b[6]));if(!cand.length)continue;spawnBugAt(x,y,wpick(cand.map(b=>[b[0],rw(b[3]*(b[5]==='water'?1.6:1),b[4],L)])));return}}
function catchBug(b){B.splice(B.indexOf(b),1);catchThing(b.id,'잡았다')}
const hotCrop=()=>CROPS[Math.floor(Date.now()/86400000)%CROPS.length][0];
const sellP=id=>IT[id].p*(id===hotCrop()?2:1);
function plantUI(tx,ty){const seeds=S.inv.filter(v=>IT[v[0]].cat==='seed');if(!seeds.length){say('',['씨앗이 없다. 펭돌이 잡화점에서 사 오자!']);return}
openModal(head('무엇을 심을까?')+`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${seeds.map(([id,n])=>`<button class="gb" data-sd="${id}" style="display:flex;align-items:center;gap:6px"><img src="${url(id)}" style="width:26px;image-rendering:pixelated">${IT[id].n} x${n}</button>`).join('')}</div>`);

function plant(tx,ty,sid){if(!cnt(sid)||S.plots[tx+','+ty])return;let c=IT[sid].crop;if(!c)c=wpick(CROPS.map(v=>[v[0],[0,40,25,15,6,1][v[5]]]));remItem(sid);S.plots[tx+','+ty]={c,g:0,w:false,f:false,rd:!IT[sid].crop};beep(600,.05);toast(IT[sid].crop?`${IT[c].n} 씨앗을 심었다`:'랜덤 씨앗을 심었다! 뭐가 자랄까?')}
function water(tx,ty){S.plots[tx+','+ty].w=true;beep(800,.04);toast('물을 줬다! 쑥쑥 자랄 거야')}
function harvest(tx,ty){const k=tx+','+ty,p=S.plots[k];const n=1+(Math.random()<.3+lvl('can')*0.05?1:0)+(p.f?1:0);if(!addItem(p.c,n))return;delete S.plots[k];const it=IT[p.c];const nw=reg(p.c);beep(990,.07);const L=[`${it.n} ${n}개를 수확했다!`+(nw?' (도감에 새로 등록!)':'')];if(!S.unl[p.c])L.push(`펭돌이에게 ${jo(it.n,'을','를')} 팔면 ${it.n} 씨앗을 살 수 있게 돼!`);say('',L)}
const LINES={momo:n=>['오늘 바람이 참 좋다~ 깡총!',`${n}, 나무를 흔들면 과일이 떨어져!`,'밭에 물을 주면 훨씬 빨리 자라! 깡총.','펭돌이한테 작물을 팔면 그 씨앗을 살 수 있게 된대!','동쪽 숲엔 버섯이랑 사슴벌레가 있대!'],

function talk(n){if(n.shop==='general'){say(n.name,['어서 오세요~ 사고 팔 거 있으면 다 가져와요!'],shopUI);return}

const fr=S.fr[n.id]||(S.fr[n.id]={f:0,t:0,g:0});const now=Date.now();if(now-fr.t>20000){fr.f++;fr.t=now}
const gl=[3,8,15];if(fr.g<gl.length&&fr.f>=gl[fr.g]){const g=pickGift();say(n.name,[`${S.name}! 우리 요즘 자주 이야기하지?`,'이거 선물이야. 받아 줘!'],()=>{fr.g++;if(g==='coins'){S.coins+=1000;say('',['1,000 코인을 받았다!'])}else if(['hat','top','bot'].includes(IT[g].cat)){own(g);say('',[`${jo(IT[g].n,'을','를')} 받았다! 가방 > 옷장에서 입어 볼 수 있어.`])}else if(addItem(g))say('',[`${jo(IT[g].n,'을','를')} 받았다!`])});return}
const L=isNight()?['하암… 밤이 깊었네. 별이 예쁘다.','밤에만 나오는 곤충이랑 물고기가 있대!']:LINES[n.id](S.name);say(n.name,[rnd(L)])}

function itemDetail(i){const[id,n]=S.inv[i];const it=IT[id];let h=`<div style="margin-bottom:6px"><b>${it.n}</b> x${n} <span class="muted">· 판매가 ${fmt(sellP(id))} 코인${it.r>1&&DEX.some(d=>d[2].includes(id))?' · '+stars(it.r):''}</span></div>`;if(it.desc)h+=`<div class="muted" style="margin-bottom:6px">${it.desc}</div>`;

function useItem(id,a){const it=IT[id];const{tx,ty}=front();const t=tileAt(tx,ty);const free=!solid(tx,ty)&&!flatAt(tx,ty)&&!npcTile(tx,ty)&&[GR,SAND,PATH,FOR].includes(t);

if(shopTab==='tool'){for(const k in TOOLS){const t=S.tools[k],tr=TOOLS[k].tiers,nx=t+1;if(nx>=tr.length){h+=`<div class="row"><img src="${turl(k,t)}"><span style="flex:1"><b>${tr[t][0]}</b><br><span class="muted">최고 등급이에요!</span></span></div>`;continue}
