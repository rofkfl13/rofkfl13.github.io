function spawnBugAt(x,y,id){const it=IT[id];B.push({id,beh:it.beh,x:x*T+8,y:y*T+(it.beh==='walk'?12:4),bx:x*T+8,by:y*T+4,ph:Math.random()*6,t:0,k:0,tx:x*T+8,ty:y*T+12,fl:Math.max(0,(it.r-1)*0.18-lvl('net')*0.08),ft:0,gone:0})}
function spawnBug(){const px=(S.px+8)>>4,py=(S.py+12)>>4;for(let n=0;n<30;n++){const x=px-12+Math.floor(Math.random()*25),y=py-8+Math.floor(Math.random()*17);if(Math.abs(x-px)<3&&Math.abs(y-py)<3)continue;const t=tileAt(x,y);if(solid(x,y)||t===SOIL)continue;const ar=[];if(t===SAND&&y>=47)ar.push('beach');else if(t===FOR)ar.push('forest');else if(t===GR||t===PATH)ar.push('meadow');
if(!(t===SAND&&y>=47))for(const d of [[0,1],[1,0],[0,-1],[-1,0],[2,0],[-2,0],[0,2],[0,-2]]){const q=tileAt(x+d[0],y+d[1]);if(q===RIVER||q===LAKE){ar.push('water');break}}
if(!ar.length)continue;const L=lvl('net')+(Date.now()<S.honeyT?1.5:0);const cand=BUGS.filter(b=>ar.includes(b[5])&&timeOk(b[6]));if(!cand.length)continue;spawnBugAt(x,y,wpick(cand.map(b=>[b[0],rw(b[3]*(b[5]==='water'?1.6:1)*wxBug(b),b[4],L)])));return}}
function catchBug(b){B.splice(B.indexOf(b),1);catchThing(b.id,'잡았다')}

const ev=todayEvents();if(ev.length&&Math.random()<.6){say(n.name,[`오늘은 ${ev[0].n}이지? 정말 축하해!`]);return}const L=(isNight()?['하암… 밤이 깊었네. 별이 예쁘다.','밤에만 나오는 곤충이랑 물고기가 있대!']:LINES[n.id](S.name)).concat(wxLine());say(n.name,[rnd(L)])}

function pullWeed(k){const w=S.weeds[k];if(!w)return;if(S.inv.length>=30&&!cnt('weed')){toast('가방이 꽉 찼어요 (30칸)');return}const key=w[0]+','+w[1];once('w'+key,async()=>{let had=null;const r=await NET.tx('island/weeds/'+key,cur=>{had=cur;return cur?null:undefined});if(r.committed&&had){addItem('weed');mHook('weed',1);beep(300,.05);toast('잡초를 뽑았다');save(true)}})}
function shakeTree(i){shake={i,t:.5};beep(180,.06);const td=TREES[i];
if(td.k==='forest'){if(Math.random()<.25){spawnBugAt(td.x,td.y+1,wpick([['cicada',3],['stag',rw(2,3,lvl('net'))],['gstag',rw(.1,5,lvl('net'))]]));toast('나무에서 무언가 떨어졌다!')}else toast('흔들흔들… 아무것도 없다');return}
once('t'+i,async()=>{let eff=0;const full=td.k==='palm'?2:3;const r=await NET.tx('island/trees/'+i,cur=>{cur=cur||{f:full,t:0};eff=cur.f===0&&nowS()>cur.t?full:cur.f;return eff>0?{f:0,t:nowS()+180000}:undefined});
if(!r.committed){toast('흔들흔들… 다시 열리려면 조금 기다리자');return}let c=eff;const acc={};for(const o of [[0,1],[-1,1],[1,1],[-1,0],[1,0],[0,-1]]){if(!c)break;const a=td.x+o[0],b=td.y+o[1];if(isWat(tileAt(a,b))||solid(a,b)||flatAt(a,b)||tileAt(a,b)===SOIL)continue;acc['ground/f'+nowS().toString(36)+i+'_'+c]=[a,b,td.fr];c--}
if(Object.keys(acc).length)await NET.update('island',acc);if(c){addItem(td.fr,c);save(true)}toast(`${IT[td.fr].n}${td.k==='palm'?'이':'가'} 떨어졌다!`)})}
function hitRock(i){once('r'+i,async()=>{const r=await NET.tx('island/rocks/'+i,cur=>nowS()-(cur||0)<90000?undefined:nowS());if(!r.committed){say('',['단단하다. 조금 있다가 다시 와 보자.']);return}beep(150,.08);const L=lvl('shovel');const it=wpick([['stone',60],['iron',rw(25,3,L)],['goldore',rw(3,5,L)],['coins',12]]);if(it==='coins'){const c=100+Math.floor(Math.random()*5)*100;S.coins+=c;toast(`${c} 코인이 튀어나왔다!`)}else if(addItem(it))toast(`${jo(IT[it].n,'을','를')} 얻었다`);save(true)})}
function dig(k){const d=S.digs[k];if(!d)return;const key=d[0]+','+d[1];once('dg'+key,async()=>{let had=null;const r=await NET.tx('island/digs/'+key,cur=>{had=cur;return cur?null:undefined});if(!(r.committed&&had))return;beep(220,.08);const L=lvl('shovel');let id;if(had==='b'&&Math.random()<.7)id=wpick(BEACH.map(b=>[b[0],rw(b[3],b[4],L)]));else id=wpick(FOSS.map(f=>[f[0],rw(f[3],f[4],L)]));catchThing(id,'파냈다');if(Math.random()<L*0.08){S.coins+=300;toast('보너스! 300 코인도 나왔다')}save(true)})}
function plant(tx,ty,sid){if(!cnt(sid))return;const key=tx+','+ty;let c=IT[sid].crop;if(!c)c=wpick(CROPS.filter(v=>!SPC[v[0]]).map(v=>[v[0],[0,40,25,15,6,1][v[5]]]));once('p'+key,async()=>{const r=await NET.tx('island/plots/'+key,cur=>cur?undefined:{c,g0:0,t0:nowS(),w:false,f:false,rd:!IT[sid].crop});if(!r.committed){toast('이미 무언가 심겨 있어요');return}remItem(sid);beep(600,.05);save(true);toast(IT[sid].crop?`${IT[c].n} 씨앗을 심었다`:'랜덤 씨앗을 심었다! 뭐가 자랄까?')})}
function water(tx,ty){const key=tx+','+ty;once('p'+key,async()=>{const wm=[1.6,2.2,3][S.tools.can];const r=await NET.tx('island/plots/'+key,cur=>{if(!cur||!IT[cur.c])return undefined;const g=plotG(cur);if(g>=IT[cur.c].t*3)return undefined;return Object.assign(cur,{g0:g,t0:nowS(),w:true,wm,ws:(cur.ws||0)|(1<<Math.min(2,Math.floor(g/IT[cur.c].t)))})});if(r.committed){beep(800,.04);toast('물을 줬다! 쑥쑥 자랄 거야')}})}
function harvest(tx,ty){const key=tx+','+ty;const p0=S.plots[key];if(!p0)return;const need=[p0.c,p0.c+'_s',p0.c+'_g'].filter(i=>!cnt(i)).length;if(S.inv.length+need>30){toast('가방 자리를 조금 비워 주세요');return}once('p'+key,async()=>{let had=null;const r=await NET.tx('island/plots/'+key,cur=>{had=cur;if(!cur||!IT[cur.c]||plotG(cur)<IT[cur.c].t*3)return undefined;return null});if(!(r.committed&&had))return;
const n=1+(Math.random()<.3+lvl('can')*0.05?1:0)+(had.f?1:0),L=lvl('can'),q=[0,0,0];for(let i=0;i<n;i++){const x=Math.random(),cr=care(had),g=.03+L*.03+cr*.07,sv=.18+L*.05+cr*.06;if(x<g)q[2]++;else if(x<g+sv)q[1]++;else q[0]++}
mHook('crop',n);if(q[0])addItem(had.c,q[0]);if(q[1])addItem(had.c+'_s',q[1]);if(q[2])addItem(had.c+'_g',q[2]);const it=IT[had.c];const nw=reg(had.c);beep(990,.07);if(q[2])setTimeout(()=>beep(1480,.12),120);save(true);
const Ls=[`${it.n} ${n}개를 수확했다! [${rlab(it.r)}]`+(nw?' (도감에 새로 등록!)':'')];if(q[1]||q[2])Ls.push(`품질 좋은 게 나왔다! 금별 ${q[2]}개 · 은별 ${q[1]}개 (금별은 3배, 은별은 1.6배 가격!)`);Ls.push(careLine(had));if(!S.unl[had.c]&&!SPC[had.c])Ls.push(`펭돌이에게 ${jo(it.n,'을','를')} 팔면 ${it.n} 씨앗을 살 수 있게 돼!`);say('',Ls)})}
function useItem(id,a){const it=IT[id];const{tx,ty}=front();const t=tileAt(tx,ty);const free=!solid(tx,ty)&&!flatAt(tx,ty)&&!npcTile(tx,ty)&&[GR,SAND,PATH,FOR].includes(t);const key=tx+','+ty;

if(a==='place'){closeModal();if(it.fp){toast('큰 가구는 집 안에만 놓을 수 있어요');return}if(!free){toast('여기엔 놓을 수 없어요');return}once('d'+key,async()=>{const r=await NET.tx('island/decor/'+key,cur=>cur?undefined:id);if(r.committed&&cnt(id)){remItem(id);save(true);toast(`${jo(it.n,'을','를')} 놓았다`)}})}
if(a==='drop'){closeModal();if(!free){toast('여기엔 내려놓을 수 없어요');return}remItem(id);save(true);NET.update('island',{['ground/d'+nowS().toString(36)+Math.random().toString(36).slice(2,6)]:[tx,ty,id]})}
if(a==='plant'){closeModal();if(t!==SOIL||S.plots[key]){toast('빈 밭을 바라보고 심어 주세요');return}plant(tx,ty,id)}
if(a==='use'){closeModal();if(id==='bait'){remItem(id);S.bait+=5;save(true);toast('떡밥을 뿌렸다! 다음 낚시 5번 귀한 물고기 확률 UP')}
if(id==='honey'){remItem(id);S.honeyT=Math.max(Date.now(),S.honeyT)+180000;save(true);toast('꿀을 발랐다! 3분 동안 귀한 곤충 확률 UP')}
if(id==='fert'){const p=S.plots[key];if(!p||p.f||stage(p)>=3){toast('자라는 중인 작물을 바라보고 써 주세요');return}once('p'+key,async()=>{const r=await NET.tx('island/plots/'+key,cur=>(!cur||cur.f||plotG(cur)>=IT[cur.c].t*3)?undefined:Object.assign(cur,{f:true}));if(r.committed&&cnt('fert')){remItem('fert');save(true);toast('비료를 줬다! 수확량 +1')}})}}}

const EMS=new Set();function onEmoteFor(k){return v=>{if(k!==ME||!v)return;for(const id in v){if(EMS.has(id))continue;EMS.add(id);const e=v[id];NET.remove('emote/'+k+'/'+id);if(!e||nowS()-(+e.t||0)>60000)continue;const f=String(e.f||'친구').slice(0,6);const t={hi:`${f}: 안녕!`,bye:`${f}: 잘 가! 또 놀자`,heart:`${f}님이 하트를 보냈어요!`,praise:`${f}님의 칭찬: ${String(e.m||'').slice(0,30)}`}[e.ty];if(!t)continue;toast(t);beep(e.ty==='heart'?1320:990,.08);if(e.ty==='heart'){S.hearts=(S.hearts||0)+1;save(true)}}}}

const SC={home:{w:12,h:9,doors:[6],out:[9,12],name:'우리 집'},museum:{w:26,h:19,doors:[12,13],out:[30,20],name:'박물관'}};

function itile(x,y){const sc=SC[S.scene];if(!sc||x<0||y<0||x>=sc.w||y>=sc.h)return'void';if(y===sc.h-1)return sc.doors.includes(x)?'door':'wall';if(y<=1||x===0||x===sc.w-1)return'wall';return'floor'}
function iSolid(x,y){const t=itile(x,y);if(t==='wall'||t==='void')return true;if(S.scene==='museum'&&PED[x+','+y])return true;if(S.scene==='home'){const k=at(S.house,x,y);if(k>=0&&!IT[S.house[k][2]].flat)return true}return false}

if(itile(tx,ty)==='door')return{l:'밖으로 나가기',fn:exitScene};if(S.scene==='museum'&&PED[tx+','+ty]){const id=PED[tx+','+ty];return{l:'전시물 보기',fn:()=>pedInfo(id)}}

function enterScene(nm){const sc=SC[nm];S.scene=nm;S.px=(sc.doors[0]+(sc.doors.length>1?.5:0))*T;S.py=(sc.h-2)*T;S.dir='up';B=[];F=null;presT=0;beep(600,.05);toast(nm==='museum'?`박물관 전시 ${Object.keys(S.museum||{}).length}/${DEXN}종`:'우리 집! 가방에서 가구를 놓아 보세요')}

const mtof=m=>440*Math.pow(2,(m-69)/12);
function note(t,f,d,v,type){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(BGM.out);o.start(t);o.stop(t+d+.05)}
function bgmTick(){if(!BGM.on||!AC||AC.state!=='running')return;const mood=isNight()?'night':weather()==='rain'?'rain':seasonEvent()==='xmas'?'xmas':'day';const M=MUS[mood],spb=60/M.bpm/2;if(BGM.next<AC.currentTime)BGM.next=AC.currentTime+.05;while(BGM.next<AC.currentTime+.3){const s=BGM.step,ch=M.ch[Math.floor(s/8)%4];if(s%8===0)ch.forEach(n=>note(BGM.next,mtof(n-12),spb*8,.016,'sine'));const m=M.mel[s%M.mel.length];if(m)note(BGM.next,mtof(m),spb*1.8,.022,'triangle');BGM.next+=spb;BGM.step++}}

// ===== pv.js : 작물 시세 · 신선도 · 정성 · 특산품 · 떠돌이 상인 · 몽글 식당 · 섬 꾸미기 · 집 넓히기 =====
const SPC={asparagus:'spring',pineapple:'summer',sweetpotato:'autumn',spinach:'winter'};
const CSEA={spring:['strawberry','cabbage','asparagus'],summer:['tomato','corn','watermelon','melon','pineapple'],autumn:['pumpkin','potato','eggplant','sweetpotato'],winter:['radish','carrot','spinach']};
const SEDIV='<div id="se" style="font-size:14px;min-height:20px;margin-top:8px;font-weight:700;color:#3f7a4a"></div>';
const escH=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayN=t=>Math.floor(kst(t).getTime()/864e5);
const dayT=d=>d*864e5-9*3600e3+12*3600e3;
const hrn=(a,b)=>(Math.abs(hash(a,b))%10007)/10007;
const GLOW={slamp:1,starlamp:1,fountain:1};

// ---------- 작물 시세 ----------
function mktRaw(c,d){const i=CROPS.findIndex(v=>v[0]===c);if(i<0)return{m:1,tag:''};const r=IT[c].r,amp=.12+.07*r;let m=1+amp*(Math.sin(d*.85+i*1.7)*.7+(hrn(d,i*13+5)-.5)*1.4),tag='';const sp=hrn(d,i*7+911);if(sp<.05){m*=1.8;tag='폭등'}else if(sp>.96){m*=.6;tag='폭락'}if(CSEA[season(dayT(d))].includes(c))m*=1.25;return{m:Math.max(.4,Math.min(2.6,Math.round(m*20)/20)),tag}}
function mkt(c,d){return mktRaw(c,d===undefined?dayN():d).m}
function hotCrop(){const d=dayN();let b=CROPS[0][0],bm=0;CROPS.forEach(c=>{if(c[0]==='gcarrot')return;const m=mkt(c[0],d);if(m>bm){bm=m;b=c[0]}});return b}

// ---------- 신선도 ----------
const ROTD=5;const perish=id=>!!(IT[id]&&IT[id].cat==='crop');
function frq(id){S.fresh=S.fresh||{};let q=S.fresh[id];if(!Array.isArray(q))q=S.fresh[id]=[];q=q.filter(b=>Array.isArray(b)&&b[1]>0);S.fresh[id]=q;const have=cnt(id);let tot=q.reduce((a,b)=>a+b[1],0);if(tot<have)q.push([Date.now(),have-tot]);else if(tot>have){let k=tot-have;while(k>0&&q.length){const u=Math.min(k,q[0][1]);q[0][1]-=u;k-=u;if(q[0][1]<=0)q.shift()}}if(!q.length)delete S.fresh[id];return q}
const ageD=t=>(Date.now()-t)/864e5;const ageM=t=>{const a=ageD(t);return a<2?1:a<4?.85:.6};
function freshInfo(id){if(!perish(id)||!cnt(id))return null;const q=frq(id);if(!q.length)return null;const a=ageD(q[0][0]);return{m:ageM(q[0][0]),lab:a<2?'싱싱해요':a<4?'조금 시들었어요 (가격 85%)':'많이 시들었어요 (가격 60%)',left:Math.max(0,ROTD-a)}}
function sellP(id,fm){const it=IT[id];if(!it)return 0;let p=it.p;if(it.cat==='crop'){const f=fm!==undefined?fm:((freshInfo(id)||{}).m||1);p=Math.max(10,Math.round(p*mkt(it.base||id)*f/10)*10)}else if(it.cat==='dish')p=Math.max(10,Math.round(p*.5/10)*10);return p}
function sellRaw(id,n){if(n<=0||!cnt(id))return{t:0};n=Math.min(n,cnt(id));let t=0;if(perish(id)){const q=frq(id);let k=n;for(const b of q){if(k<=0)break;const u=Math.min(k,b[1]);t+=sellP(id,ageM(b[0]))*u;k-=u}if(k>0)t+=sellP(id,1)*k}else t=sellP(id)*n;
S.coins+=t;remItem(id,n);S.sold[id]=(S.sold[id]||0)+n;let u=null;const bs=IT[id].base||id;if(IT[id].cat==='crop'&&!S.unl[bs]&&!SPC[bs]){S.unl[bs]=1;u=IT[bs].n+' 씨앗'}return{t,u}}
const _addI=addItem,_remI=remItem;
addItem=function(id,n=1){if(perish(id))frq(id);const ok=_addI(id,n);if(ok&&perish(id)){S.fresh=S.fresh||{};(S.fresh[id]=S.fresh[id]||[]).push([Date.now(),n])}return ok};
remItem=function(id,n=1){if(perish(id))frq(id);_remI(id,n);if(perish(id))frq(id)};
function rotTick(){if(!S||!S.name||!S.fresh)return;const out=[];for(const id of Object.keys(S.fresh)){if(!perish(id))continue;const q=frq(id);let n=0;for(const b of q){if(ageD(b[0])>=ROTD)n+=b[1];else break}if(n){remItem(id,n);addItem('rotten',n);out.push(`${IT[id].n} ${n}개`)}}if(out.length){toast(`앗, 가방 속 ${out.join(', ')}가 썩어 버렸어요…`);save(true)}}

// ---------- 정성 (잘 자란 기준) ----------
const wsN=p=>{const w=p.ws||0;return(w&1)+((w>>1)&1)+((w>>2)&1)};
